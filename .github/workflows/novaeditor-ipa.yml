name: Build NovaEditor IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaEditor-iOS/**"
      - ".github/workflows/novaeditor-ipa.yml"

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd NovaEditor-iOS
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project NovaEditor-iOS/NovaEditor.xcodeproj \
            -scheme NovaEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NovaEditor.app Payload/
          zip -qr NovaEditor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NovaEditor-IPA
          path: NovaEditor.ipa
