name: NovaEditor
options:
  bundleIdPrefix: com.novaeditor
  deploymentTarget:
    iOS: "16.0"
targets:
  NovaEditor:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/effects
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novaeditor.app
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
